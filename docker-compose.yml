name: klados

# Local dev (start.sh / start.bat) only brings up `postgres` and `redis`;
# `docker compose up --build` (start_radar.*) runs the whole stack.

x-backend-env: &backend-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgrespassword
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: leads_db
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # Ollama runs on the host, not in the stack.
  OLLAMA_URL: http://host.docker.internal:11434/api/generate

services:
  postgres:
    image: postgres:16
    container_name: klados_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: klados_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: klados_api
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: klados_worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: klados_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  # Pinned to the names the volumes had when this compose file lived in
  # lead-radar/backend/, so existing leads survive the move.
  postgres_data:
    name: backend_postgres_data
  redis_data:
    name: backend_redis_data
